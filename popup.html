<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FormPilot</title>
  <link rel="stylesheet" href="styles/one-ui.css">
  <style>
    /* Popup shell only — every value comes from the tokens in one-ui.css. */
    body {
      width: 380px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      padding: 0 var(--s5) var(--s4);
    }
    .popup-body { flex: 1; display: flex; flex-direction: column; gap: var(--s4); }
    .popup-footer {
      display: flex;
      gap: var(--s5);
      padding-top: var(--s4);
      margin-top: var(--s2);
      border-top: 1px solid var(--divider);
      font: var(--t-caption);
    }
    .popup-footer a { color: var(--text-2); cursor: pointer; }
    .popup-footer a:hover { color: var(--accent); }
    .site { font: var(--t-caption); color: var(--text-3); word-break: break-all; }
    /* The bar is pushed to the bottom of the popup even when content is short. */
    .bottom-bar { margin-top: auto; }
  </style>
</head>
<body>
  <header class="app-title">
    <div class="app-title__row">
      <img src="icons/icon48.png" alt="">
      <h1>FormPilot</h1>
      <span id="lockBadge" class="badge" style="margin-left:auto">Locked</span>
    </div>
    <p class="site" id="site"></p>
  </header>

  <div class="popup-body">
    <p class="locked-note hidden" id="lockedNote">
      The vault is locked. Unlock it in the vault tab and the key stays available
      until you close Chrome.
    </p>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <footer class="popup-footer">
      <a id="optionsLink">Open vault &rarr;</a>
      <a id="lockLink" class="hidden">Lock</a>
    </footer>
  </div>

  <!-- Signature element: the primary action sits in a floating glass pill at
       the bottom, within thumb reach rather than up in a toolbar. -->
  <div class="bottom-bar">
    <button id="teachBtn" class="btn btn--tonal btn--auto" type="button">Teach</button>
    <button id="fillBtn" class="btn btn--primary" type="button">Fill this form</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
