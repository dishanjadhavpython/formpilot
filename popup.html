<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FormPilot</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #14231c;
      --muted: #5c7268;
      --brand: #0b6e4f;
      --brand-dark: #095c42;
      --line: #dfe7e3;
    }
    * { box-sizing: border-box; }
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    header { display: flex; align-items: center; gap: 10px; }
    header img { width: 28px; height: 28px; border-radius: 6px; }
    h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
    .tagline { margin: 2px 0 14px; font-size: 12px; color: var(--muted); }
    button {
      width: 100%;
      padding: 9px 12px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--brand);
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }
    button:hover { background: var(--brand-dark); }
    button:disabled { opacity: 0.6; cursor: default; }
    #status {
      margin-top: 12px;
      min-height: 18px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-word;
    }
    #status.ok { color: var(--brand); }
    #status.err { color: #b3261e; }
    footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 12px;
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--brand); text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>FormPilot</h1>
  </header>
  <p class="tagline">Local-first vault &amp; autofill. Nothing leaves this device.</p>

  <button id="checkBtn" type="button">Check connection</button>
  <p id="status" role="status" aria-live="polite"></p>

  <footer><a id="optionsLink" href="#">Open vault &amp; settings &rarr;</a></footer>

  <!-- MV3 forbids inline scripts, so all JS lives in popup.js -->
  <script src="popup.js"></script>
</body>
</html>
